name: Build Windows installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyinstaller

      - name: Test
        run: pytest -q

      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name ImageMagic
          --collect-data image_magic --collect-data certifi --hidden-import pillow_heif
          --collect-all onnxruntime
          packaging/launcher.py

      - name: Cache smart search model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/im-selftest/models
          key: clip-vit-b-16-52d329a1-e2bb83fb-buffalo_l-80ffe37d

      - name: Self-test packaged app (place lookup, AI runtime, model download and real search)
        shell: pwsh
        run: |
          $env:IMAGE_MAGIC_HOME = "$env:RUNNER_TEMP\im-selftest"
          $report = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process dist\ImageMagic\ImageMagic.exe -ArgumentList "--self-test",$report,"--self-test-download" -PassThru -Wait
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
          $r = Get-Content $report | ConvertFrom-Json
          if (-not ($r.providers -contains "DmlExecutionProvider")) { throw "DirectML (GPU) support missing from the build" }

      - name: Bundle icloudpd
        shell: pwsh
        run: |
          # The icloudpd wheel ships a standalone build at <site-packages>\icloudpd\icloudpd
          # (no extension); Scripts\icloudpd.exe is only a launcher that needs Python.
          $dir = python -c "import importlib.util as u; print(list(u.find_spec('icloudpd').submodule_search_locations)[0])"
          $src = Join-Path $dir "icloudpd"
          $size = (Get-Item $src).Length
          Write-Host "icloudpd: $src ($size bytes)"
          # Must be the standalone build, not a tiny pip launcher that needs Python.
          if ($size -lt 5MB) { throw "icloudpd.exe looks like a pip stub, not a standalone build" }
          Copy-Item $src dist\ImageMagic\icloudpd.exe
          & dist\ImageMagic\icloudpd.exe --version
          if ($LASTEXITCODE -ne 0) { throw "bundled icloudpd.exe does not run" }

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:IMAGE_MAGIC_HOME = "$env:RUNNER_TEMP\im-home"
          $p = Start-Process dist\ImageMagic\ImageMagic.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          $session = "$env:IMAGE_MAGIC_HOME\session.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $session); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $session)) { throw "app did not start" }
          $html = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          $token = (Get-Content $session | ConvertFrom-Json).token
          if ($html.Contains($token)) { throw "page must not contain the access token" }
          $h = @{ "X-Token" = $token }
          $st = Invoke-RestMethod http://127.0.0.1:8799/api/status -Headers $h
          Write-Host "status OK, version $($st.version), library $($st.library)"
          Invoke-RestMethod http://127.0.0.1:8799/api/quit -Method Post -Headers $h -ContentType "application/json" -Body "{}" | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "app did not quit" }
          if (Test-Path $session) { throw "session file should be removed on quit" }

      - name: Build installer
        id: version
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $version = (python -c "import image_magic; print(image_magic.__version__)")
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-Item dist\ImageMagic-Setup.exe

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ImageMagic-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ImageMagic-Setup.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ImageMagic-Setup
          path: |
            dist/ImageMagic-Setup.exe
            dist/SHA256SUMS.txt

    outputs:
      version: ${{ steps.version.outputs.version }}

  # Publishing is the only step that needs write access, so it runs as its own job
  # with its own permissions. Every push to master refreshes the release for the
  # current version (bump __version__ to start a new one).
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ImageMagic-Setup
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Image Magic ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Install:** download `ImageMagic-Setup.exe` below and double-click it.
            If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            Check the download against `SHA256SUMS.txt` if you want to be sure it is the file built here.
            Image Magic only copies photos from iCloud. It never deletes anything in iCloud.
          files: |
            dist/ImageMagic-Setup.exe
            dist/SHA256SUMS.txt

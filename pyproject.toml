[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-magic"
version = "0.3.0"
description = "Back up, catalog and (soon) categorize an iCloud photo library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "icloudpd>=1.33",
    "pillow>=11",
    "pillow-heif>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
image-magic = "image_magic.cli:main"

[project.gui-scripts]
image-magic-app = "image_magic.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_magic = ["static/*", "static/vendor/*", "static/vendor/images/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
